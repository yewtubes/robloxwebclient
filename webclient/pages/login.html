<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Log in</title>
<link rel="preload" as="image" href="/pages/assets/landing.jpg">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/pages/assets/BuilderSans-Regular.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/pages/assets/BuilderExtended-ExtraBold.woff2">
<style>
  /* Fonts and background: tools/fetch_login_assets.sh. */
  @font-face { font-family: "Builder Sans"; src: url(/pages/assets/BuilderSans-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Builder Sans"; src: url(/pages/assets/BuilderSans-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Builder Sans"; src: url(/pages/assets/BuilderSans-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Builder Sans"; src: url(/pages/assets/BuilderSans-Bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Builder Extended"; src: url(/pages/assets/BuilderExtended-ExtraBold.woff2) format("woff2"); font-weight: 800; font-display: swap; }

  :root {
    color-scheme: dark;
    --bg: #0e0f11; --fill: #1a1b1f; --fill-hover: #212227; --seg: #17181b;
    --fg: #f4f5f7; --soft: #c9ccd4; --muted: #8c909b; --line: #26272c;
    --focus: #7aa2ff; --err: #ff6b62; --cta: #335fff; --cta-hover: #4a70ff; --cta-fg: #fff;
    --sans: "Builder Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --display: "Builder Extended", "Builder Sans", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }

  .page { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(420px, 1fr); min-height: 100vh; padding: 14px; gap: 14px; }

  /* A framed window onto roblox.com's landing video. It has no controls and
     can't be clicked, paused or opened picture-in-picture. */
  .showcase { position: relative; overflow: hidden; border-radius: 22px; background: #1d1e22 url(/pages/assets/landing.jpg) center / cover; user-select: none; }
  .showcase video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  /* Form column. */
  .side { display: flex; flex-direction: column; padding: 20px clamp(20px, 4vw, 56px) 14px; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0; }
  .form { width: 100%; max-width: 380px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; margin-bottom: 32px; border: 1px solid var(--line); border-radius: 12px; background: var(--seg); }
  .seg a { padding: 8px 0; border-radius: 8px; text-align: center; color: var(--muted); font-weight: 600; font-size: 14px; text-decoration: none; transition: background .2s, color .2s; }
  .seg a:hover { color: var(--soft); }
  .seg a[aria-current="page"] { background: var(--fill-hover); color: var(--fg); box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset; }
  .seg a:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  h1 { margin: 0; font: 700 30px/1.15 var(--sans); letter-spacing: -.01em; }
  .sub { margin: 6px 0 28px; color: var(--muted); font-size: 15px; }

  .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .field > label, .field > .label { font-size: 13px; font-weight: 600; color: var(--soft); }
  .opt { font-weight: 400; color: var(--muted); }
  .input { position: relative; display: flex; align-items: center; height: 46px; padding: 0 14px; border: 1px solid transparent; border-radius: 12px; background: var(--fill); transition: background .15s, border-color .15s; }
  .input:hover { background: var(--fill-hover); }
  .input:focus-within { border-color: var(--focus); background: var(--fill); }
  .input input, .input select { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: none; color: var(--fg); font: 400 15px var(--sans); appearance: none; }
  .input input::placeholder { color: var(--muted); }
  .input select { cursor: pointer; padding-right: 18px; }
  .input select:invalid { color: var(--muted); }
  .input select option { background: var(--fill); color: var(--fg); }
  .input.select::after { content: ""; position: absolute; right: 15px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); pointer-events: none; }
  .birthday { display: grid; grid-template-columns: 1.4fr .9fr 1fr; gap: 8px; }
  .reveal { flex: none; margin-right: -6px; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--muted); font: 600 12px var(--sans); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
  .reveal:hover { color: var(--fg); background: rgba(255, 255, 255, .06); }

  .extra { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .45s cubic-bezier(.22, 1, .36, 1), opacity .3s; }
  .extra > div { overflow: hidden; }
  .signup .extra { grid-template-rows: 1fr; opacity: 1; }

  #err { min-height: 20px; margin: 2px 0 10px; color: var(--err); font-size: 14px; }
  .go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--cta); color: var(--cta-fg); font: 700 15px var(--sans); cursor: pointer; transition: opacity .15s, transform .1s; }
  .go:hover:not(:disabled) { background: var(--cta-hover); }
  .go:active:not(:disabled) { transform: scale(.99); }
  .go:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .go:disabled { opacity: .5; cursor: default; }
  .fine { display: flex; gap: 8px; margin: 18px 0 0; color: var(--muted); font-size: 13px; }
  .fine svg { flex: none; margin-top: 2px; }

  .bottom { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }

  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 10px; gap: 0; }
    .showcase { height: 180px; border-radius: 18px; }
    .side { padding: 0 8px 8px; }
    main { align-items: flex-start; padding: 24px 0 28px; }
    .form { max-width: none; }
    .seg { margin-bottom: 24px; }
  }
</style>
</head>
<body>
<div class="page">
  <section class="showcase" aria-hidden="true" oncontextmenu="return false">
    <video id="bg" src="/pages/assets/landing.webm" poster="/pages/assets/landing.jpg" autoplay muted loop playsinline preload="auto"
      disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback" tabindex="-1"></video>
  </section>

  <div class="side">
    <main>
      <div class="form">
        <nav class="seg" aria-label="Account">
          <a id="tab-login" href="/login">Log in</a>
          <a id="tab-signup" href="/signup">Sign up</a>
        </nav>
        <h1 id="title">Good to see you</h1>
        <p class="sub" id="sub">Log in with your local account.</p>
        <form id="form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <div class="input"><input id="username" name="username" maxlength="20" autocomplete="username" spellcheck="false" autocapitalize="none"></div>
          </div>
          <div class="extra"><div>
            <div class="field">
              <label for="displayName">Display name <span class="opt">(optional)</span></label>
              <div class="input"><input id="displayName" name="displayName" maxlength="20" autocomplete="nickname" spellcheck="false"></div>
            </div>
            <div class="field" role="group" aria-labelledby="bday">
              <span class="label" id="bday">Birthday</span>
              <div class="birthday">
                <div class="input select"><select id="month" aria-label="Month" required><option value="" disabled selected>Month</option></select></div>
                <div class="input select"><select id="day" aria-label="Day" required><option value="" disabled selected>Day</option></select></div>
                <div class="input select"><select id="year" aria-label="Year" required><option value="" disabled selected>Year</option></select></div>
              </div>
            </div>
          </div></div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input">
              <input id="password" name="password" type="password" maxlength="200" autocomplete="current-password">
              <button class="reveal" id="reveal" type="button" aria-pressed="false">Show</button>
            </div>
          </div>
          <div id="err" role="alert"></div>
          <button class="go" id="submit"><span id="submit-label">Log in</span></button>
        </form>
        <p class="fine">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H4a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 4 15h8a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 12 6h-.5V4.5A3.5 3.5 0 0 0 8 1Zm2 5V4.5a2 2 0 1 0-4 0V6h4Z"/></svg>
          <span>Accounts here are local to this server, not Roblox accounts. Don't reuse your Roblox password.</span>
        </p>
      </div>
    </main>
    <div class="bottom"><span>Self-hosted. Not affiliated with Roblox Corporation.</span></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  // Background video (tools/fetch_login_assets.sh): skip its opening white
  // fade on first load, and resume whenever something pauses it.
  const bg = $('bg');
  bg.addEventListener('loadedmetadata', () => { bg.currentTime = 8; }, { once: true });
  const resume = () => { if (bg.paused) bg.play().catch(() => {}); };
  bg.addEventListener('pause', resume);
  document.addEventListener('visibilitychange', resume);
  if ('mediaSession' in navigator) for (const a of ['pause', 'stop']) try { navigator.mediaSession.setActionHandler(a, resume); } catch {}
  const params = new URLSearchParams(location.search);
  const returnUrl = /^\/(?!\/)/.test(params.get('returnUrl') || '') ? params.get('returnUrl') : '/games/start?placeId=1818';
  const qs = `?returnUrl=${encodeURIComponent(returnUrl)}`;
  $('tab-login').href = `/login${qs}`;
  $('tab-signup').href = `/signup${qs}`;

  // Birthday dropdowns (month / day / year), sent as YYYY-MM-DD.
  ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
    .forEach((m, i) => $('month').add(new Option(m, i + 1)));
  for (let d = 1; d <= 31; d++) $('day').add(new Option(d, d));
  for (let y = new Date().getFullYear(), end = y - 100; y >= end; y--) $('year').add(new Option(y, y));
  const birthdate = () => {
    const y = +$('year').value, m = +$('month').value, d = +$('day').value;
    const dt = new Date(Date.UTC(y, m - 1, d));
    return y && m && d && dt.getUTCMonth() === m - 1 ? dt.toISOString().slice(0, 10) : null;
  };

  // Log in and sign up share the page; the switch keeps the URL in step.
  let signup;
  function setMode(s, push) {
    signup = s;
    document.body.classList.toggle('signup', s);
    $(s ? 'tab-signup' : 'tab-login').setAttribute('aria-current', 'page');
    $(s ? 'tab-login' : 'tab-signup').removeAttribute('aria-current');
    document.title = s ? 'Sign up' : 'Log in';
    $('title').textContent = s ? 'Make an account' : 'Good to see you';
    $('sub').textContent = s ? 'It takes a few seconds. No email needed.' : 'Log in with your local account.';
    $('submit-label').textContent = s ? 'Create account' : 'Log in';
    $('password').placeholder = s ? '8 characters or more' : '';
    $('password').autocomplete = s ? 'new-password' : 'current-password';
    for (const el of document.querySelectorAll('.extra input, .extra select')) el.tabIndex = s ? 0 : -1;
    $('err').textContent = '';
    if (push) history.pushState(null, '', `/${s ? 'signup' : 'login'}${location.search}`);
  }
  setMode(location.pathname === '/signup');
  addEventListener('popstate', () => setMode(location.pathname === '/signup'));
  for (const id of ['tab-login', 'tab-signup']) {
    $(id).addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault();
      const s = id === 'tab-signup';
      if (s !== signup) setMode(s, true);
      $('username').focus();
    });
  }

  $('reveal').addEventListener('click', () => {
    const show = $('password').type === 'password';
    $('password').type = show ? 'text' : 'password';
    $('reveal').textContent = show ? 'Hide' : 'Show';
    $('reveal').setAttribute('aria-pressed', show);
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('err');
    const body = { username: $('username').value.trim(), password: $('password').value };
    if (!body.username || !body.password) return (err.textContent = 'Enter your username and password.');
    if (signup) {
      body.birthdate = birthdate();
      if (!body.birthdate) return (err.textContent = 'Enter a valid birthday.');
      if ($('displayName').value.trim()) body.displayName = $('displayName').value.trim();
    }
    err.textContent = '';
    $('submit').disabled = true;
    try {
      const r = await fetch(`/api/local/auth/${signup ? 'signup' : 'login'}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (r.ok) return location.assign(returnUrl);
      const j = await r.json().catch(() => ({}));
      err.textContent = (j.errors && j.errors[0] && j.errors[0].message) || `Request failed (HTTP ${r.status})`;
    } catch {
      err.textContent = 'Could not reach the server.';
    }
    $('submit').disabled = false;
  });
</script>
</body>
</html>
